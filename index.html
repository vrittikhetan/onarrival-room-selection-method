<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnArrival — Room Selection Prototype</title>
<style>
  :root{
    --ink:#12161c; --ink2:#5b6472; --ink3:#8b95a3;
    --line:#e6e9ee; --bg:#f4f6f9; --card:#fff;
    --accent:#0a6cff; --accent-soft:#eaf2ff;
    --good:#0b7a4b; --good-soft:#e8f6ef;
    --warn:#a35a00; --warn-soft:#fff4e3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#dfe4ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
       display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 12px}
  .phone{width:100%;max-width:390px;background:var(--bg);border-radius:26px;overflow:hidden;
         box-shadow:0 18px 50px rgba(15,25,45,.22);position:relative;min-height:780px;display:flex;flex-direction:column}

  header{background:#fff;padding:14px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .back{font-size:20px;color:var(--ink2);line-height:1;background:none;border:none;padding:0;cursor:pointer}
  .htitle{font-size:16px;font-weight:650;margin:6px 0 2px}
  .hsub{font-size:12.5px;color:var(--ink2)}

  .stepper-wrap{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);
                display:flex;align-items:center;justify-content:space-between}
  .stepper-wrap .lbl{font-size:13.5px;font-weight:600}
  .stepper{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:20px;padding:4px 10px}
  .stepper button{width:24px;height:24px;border:none;background:none;font-size:19px;color:var(--accent);cursor:pointer;line-height:1;padding:0}
  .stepper button:disabled{color:var(--ink3)}
  .stepper span{font-size:14px;font-weight:650;min-width:10px;text-align:center}

  .ribbon{padding:9px 16px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);
          border-bottom:1px solid var(--line)}

  main{padding:12px 12px 130px;flex:1}

  .ghead{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 7px;margin-top:6px}
  .gname{font-size:15px;font-weight:750;letter-spacing:-.2px}
  .gfrom{font-size:11.5px;color:var(--ink2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .card-top{display:flex;gap:11px;padding:11px}
  .photo{width:88px;height:78px;border-radius:9px;flex:none;object-fit:cover;
         background:linear-gradient(140deg,#c7d3e4,#9fb2cc)}
  .nophoto{width:88px;height:78px;border-radius:9px;flex:none;background:#f0f2f6;border:1px dashed #ccd3de;
           display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;
           color:var(--ink3);padding:6px;line-height:1.25}
  .rname{font-size:14.5px;font-weight:650;line-height:1.25}
  .rsup{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.3}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .chip{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink2)}
  .chip.flag{background:var(--warn-soft);border-color:#f2ddba;color:var(--warn)}

  .card-bot{display:flex;justify-content:space-between;align-items:flex-end;padding:0 11px 11px}
  .ptotal{font-size:17px;font-weight:700;letter-spacing:-.2px}
  .pnight{font-size:11px;color:var(--ink2);margin-top:1px}
  .expand{background:var(--accent-soft);color:var(--accent);border:none;border-radius:8px;
          padding:8px 12px;font-size:12.5px;font-weight:650;cursor:pointer}

  .rates{border-top:1px solid var(--line);background:#fbfcfd;display:none}
  .rates.open{display:block}
  .rhead{display:grid;grid-template-columns:1fr 1fr 74px;gap:6px;padding:9px 11px 5px;
         font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
  .rrow{display:grid;grid-template-columns:1fr 1fr 74px;gap:6px;align-items:center;
        padding:9px 11px;border-top:1px solid var(--line);cursor:pointer}
  .rrow.on{background:var(--accent-soft)}
  .rrow.dead{opacity:.45;cursor:not-allowed}
  .rc{font-size:12px;line-height:1.3}
  .rc.free{color:var(--good);font-weight:600}
  .rc.terms{color:var(--warn);text-decoration:underline dotted;font-weight:600}
  .rprice{text-align:right;font-size:13.5px;font-weight:700}
  .rprice small{display:block;font-weight:400;font-size:10px;color:var(--ink2)}
  .rfoot{padding:8px 11px 11px;font-size:10.5px;color:var(--ink3);line-height:1.4}
  .rfoot a{color:var(--accent);text-decoration:none;font-weight:600}

  .review{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .rline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rline:last-of-type{border-bottom:none}
  .rl-name{font-size:13.5px;font-weight:650}
  .rl-meta{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.4}
  .edit{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:650;padding:0}
  .money{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:5px 0}
  .money.total{font-size:16px;font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}

  .alert{background:var(--warn-soft);border:1px solid #f2ddba;color:var(--warn);border-radius:10px;
         padding:10px 12px;font-size:12px;line-height:1.45;margin-bottom:10px}
  .note{font-size:11px;color:var(--ink3);text-align:center;padding:4px 8px 0;line-height:1.45}

  .bar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
       padding:10px 14px 14px;display:flex;align-items:center;gap:12px;z-index:6}
  .bar .info{flex:1;min-width:0}
  .bar .bt{font-size:15px;font-weight:700}
  .bar .bs{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cta{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 18px;
       font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap}
  .cta:disabled{background:#c3cbd8;cursor:not-allowed}

  .same{width:100%;background:var(--good-soft);border:1px solid #bfe5d3;color:var(--good);
        border-radius:12px;padding:12px;font-size:13.5px;font-weight:650;cursor:pointer;margin-bottom:10px;text-align:left}
  .same small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px;margin-top:3px}

  .divider{font-size:11px;color:var(--ink3);text-align:center;margin:2px 0 10px}

  .sheet{position:absolute;inset:0;background:rgba(10,18,30,.45);display:none;align-items:flex-end;z-index:10}
  .sheet.open{display:flex}
  .sheet-in{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:72%;overflow:auto}
  .sheet-in h4{margin:0 0 8px;font-size:15px}
  .raw{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;
       font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink2);line-height:1.5;white-space:pre-wrap}
  .sheet-in p{font-size:12.5px;color:var(--ink2);line-height:1.5}
  .close{width:100%;margin-top:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:650;cursor:pointer}
  .caption{max-width:390px;margin:14px auto 0;font-size:12px;color:#41506a;line-height:1.55;text-align:center}
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="back" onclick="goBack()">‹</button>
    <div class="htitle">Taj MG Road, Bengaluru</div>
    <div class="hsub">20–23 Nov · 3 nights · 2 guests</div>
  </header>

  <div class="stepper-wrap" id="stepWrap">
    <div class="lbl">Rooms</div>
    <div class="stepper">
      <button onclick="setRooms(-1)" id="minus">−</button>
      <span id="roomCount">1</span>
      <button onclick="setRooms(1)" id="plus">+</button>
    </div>
  </div>

  <div class="ribbon" id="ribbon" style="display:none"></div>
  <main id="main"></main>

  <div class="bar" id="bar"></div>

  <div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
    <div class="sheet-in" id="sheetIn"></div>
  </div>
</div>

<div class="caption">
  Prototype · real room names taken from live listings for Taj MG Road, Bengaluru (13 options shown by the supplier).<br>
  Card titles show only what differs inside a group. Try: 2 rooms · the Luxury Room card · the sold-out rate.
</div>

<script>
const NIGHTS = 3;

const ROOMS = [
  { id:'dk-city', cat:'Deluxe Room', view:'City view',
    supplier:'Deluxe Room, 1 King Bed, City View',
    bed:'1 King', sleeps:'Sleeps 3', size:'324 sq ft', photo:true,
    rates:[
      {id:'a', meal:'Breakfast', cancel:'Free till 18 Nov', free:true,  night:9400},
      {id:'b', meal:'Breakfast', cancel:'Non-refundable',  free:false, night:8500},
      {id:'c', meal:'Room only', cancel:'Free till 18 Nov', free:true,  night:8200},
      {id:'d', meal:'Room only', cancel:'Non-refundable',  free:false, night:7600, sold:true}
    ]},
  { id:'dk-lake', cat:'Deluxe Room', view:'Lake view',
    supplier:'Deluxe Room, 1 King Bed, Lake View',
    bed:'1 King', sleeps:'Sleeps 3', size:'323 sq ft', photo:true,
    rates:[
      {id:'a', meal:'Breakfast', cancel:'Free till 18 Nov', free:true,  night:10200},
      {id:'b', meal:'Breakfast', cancel:'Non-refundable',  free:false, night:9300},
      {id:'c', meal:'Room only', cancel:'Free till 18 Nov', free:true,  night:9000}
    ]},
  { id:'dt-lake', cat:'Deluxe Room', view:'Lake view',
    supplier:'Deluxe Room, 2 Twin Beds, Lake View',
    bed:'2 Twin', sleeps:'Sleeps 3', size:'323 sq ft', photo:true,
    rates:[
      {id:'a', meal:'Breakfast', cancel:'Free till 18 Nov', free:true,  night:10200},
      {id:'b', meal:'Room only', cancel:'Non-refundable',  free:false, night:8900}
    ]},
  { id:'lux-city', cat:'Luxury Room', view:'City view',
    supplier:'LUX KNG CTY NR PROMO SAVER',
    bed:'1 King', sleeps:'Sleeps 2', size:null, photo:false, thin:true,
    rates:[
      {id:'a', meal:'Breakfast', cancel:'See terms', unmapped:true, night:11800},
      {id:'b', meal:'Room only', cancel:'See terms', unmapped:true, night:10900}
    ]},
  { id:'suite', cat:'Deluxe Suite', view:'City view',
    supplier:'Deluxe Suite, 1 King Bed (Garden)',
    bed:'1 King', sleeps:'Sleeps 3', size:'520 sq ft', photo:true,
    rates:[
      {id:'a', meal:'Breakfast', cancel:'Free till 18 Nov', free:true,  night:18500},
      {id:'b', meal:'Breakfast', cancel:'Non-refundable',  free:false, night:16900}
    ]}
];

let roomsWanted = 1;
let current = 0;                 // which room we are choosing
let picks = [];                  // {roomId, rateId}
let openCard = null;
let screen = 'list';             // list | review
let priceBumped = false;

const inr = n => '₹' + n.toLocaleString('en-IN');
const total = r => r.night * NIGHTS;
const findRoom = id => ROOMS.find(r => r.id === id);
const findRate = (rm, id) => rm.rates.find(x => x.id === id);

// group rooms by category, in the order they first appear
function groups(){
  const out = [];
  ROOMS.forEach(r => {
    let g = out.find(x => x.cat === r.cat);
    if (!g){ g = { cat: r.cat, rooms: [] }; out.push(g); }
    g.rooms.push(r);
  });
  return out;
}

// the card title carries only what VARIES inside its group
function titleFor(r, group){
  const varies = k => new Set(group.map(x => x[k])).size > 1;
  const parts = [];
  if (group.length === 1){ parts.push(r.bed); if (r.view) parts.push(r.view); }
  else {
    if (varies('bed'))  parts.push(r.bed);
    if (varies('view')) parts.push(r.view);
    if (!parts.length && varies('size')) parts.push(r.size);
  }
  return parts.join(' · ') || 'Standard';
}
// anything shared across the group drops out of the title and into the chips
function chipsFor(r, group){
  const t = titleFor(r, group);
  const c = [];
  if (!t.includes(r.bed)) c.push(r.bed);
  if (r.view && !t.includes(r.view)) c.push(r.view);
  c.push(r.sleeps);
  c.push(r.size ? r.size : null);
  return c;
}
function labelFor(r){
  const g = groups().find(x => x.cat === r.cat);
  return r.cat + ' · ' + titleFor(r, g.rooms);
}

function setRooms(d){
  const n = Math.min(4, Math.max(1, roomsWanted + d));
  if (n === roomsWanted) return;
  roomsWanted = n;
  picks = picks.slice(0, n);
  current = Math.min(current, n - 1);
  render();
}

function toggle(id){ openCard = openCard === id ? null : id; render(); }

function pick(roomId, rateId){
  const rt = findRate(findRoom(roomId), rateId);
  if (rt.sold) return;
  picks[current] = { roomId, rateId };
  render();
}

function next(){
  if (current < roomsWanted - 1){ current++; openCard = null; window.scrollTo(0,0); }
  else { screen = 'review'; }
  render();
}

function editRoom(i){ current = i; screen = 'list'; openCard = picks[i] ? picks[i].roomId : null; render(); }
function goBack(){ if (screen === 'review'){ screen='list'; render(); } }

function sameAsFirst(){
  picks[current] = { ...picks[0] };
  render();
}

function bumpPrice(){ priceBumped = true; render(); }

function showRaw(roomId){
  const r = findRoom(roomId);
  document.getElementById('sheetIn').innerHTML = `
    <h4>What the supplier actually sent</h4>
    <div class="raw">room_name: "${r.supplier}"
bed_code:  ${r.bed === '2 Twin' ? 'TWN' : 'KNG'}
board:     ${r.thin ? 'null' : 'BB'}
refundable:${r.thin ? ' null' : ' true (until 2026-11-18)'}
occupancy: ${r.thin ? 'null' : r.sleeps.replace('Sleeps ','')}</div>
    <p>${r.thin
      ? 'We could not map the cancellation policy or the board code to a value we trust, so we do not print a friendly label. The traveler sees the supplier’s own wording instead of a guess we might get wrong.'
      : 'Structured fields came through cleanly, so we can show plain-language labels above.'}</p>
    <button class="close" onclick="closeSheet()">Close</button>`;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }

function cardHTML(r, group){
  const cheapest = Math.min(...r.rates.filter(x=>!x.sold).map(total));
  const isOpen = openCard === r.id;
  const mine = picks[current];
  const selected = mine && mine.roomId === r.id;
  const selRate = selected ? findRate(r, mine.rateId) : null;

  const rows = r.rates.map(rt => {
    const on = selected && mine.rateId === rt.id;
    const cancelCls = rt.unmapped ? 'terms' : (rt.free ? 'free' : '');
    const click = rt.unmapped
      ? `showRaw('${r.id}')`
      : (rt.sold ? '' : `pick('${r.id}','${rt.id}')`);
    return `<div class="rrow ${on?'on':''} ${rt.sold?'dead':''}" onclick="${click}">
      <div class="rc">${rt.meal}</div>
      <div class="rc ${cancelCls}">${rt.sold ? 'Just sold out' : rt.cancel}</div>
      <div class="rprice">${inr(total(rt))}<small>${inr(rt.night)}/nt</small></div>
    </div>`;
  }).join('');

  return `<div class="card ${selected?'sel':''}">
    <div class="card-top">
      ${r.photo
        ? `<div class="photo"></div>`
        : `<div class="nophoto">No photo<br>from supplier</div>`}
      <div style="min-width:0">
        <div class="rname">${titleFor(r, group)}</div>
        <div class="rsup">Supplier: ${r.supplier}</div>
        <div class="chips">
          ${chipsFor(r, group).map(c => c
            ? `<span class="chip">${c}</span>`
            : `<span class="chip flag">Size not given</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="card-bot">
      <div>
        <div class="ptotal">${selected ? inr(total(selRate)) : 'from ' + inr(cheapest)}</div>
        <div class="pnight">${selected ? selRate.meal + ' · ' + selRate.cancel : 'total for 3 nights, taxes included'}</div>
      </div>
      <button class="expand" onclick="toggle('${r.id}')">
        ${isOpen ? 'Hide' : r.rates.length + ' option' + (r.rates.length>1?'s':'')} ${isOpen ? '⌃' : '⌄'}
      </button>
    </div>
    <div class="rates ${isOpen?'open':''}">
      <div class="rhead"><div>Meal</div><div>Cancellation</div><div style="text-align:right">Price</div></div>
      ${rows}
      <div class="rfoot">${r.thin
        ? 'Cancellation terms could not be read from this supplier. <a href="#" onclick="showRaw(\''+r.id+'\');return false">See their exact wording</a> before you book.'
        : 'Prices are for all 3 nights and include taxes and fees.'}</div>
    </div>
  </div>`;
}

function render(){
  const main = document.getElementById('main');
  const bar  = document.getElementById('bar');
  const ribbon = document.getElementById('ribbon');
  document.getElementById('roomCount').textContent = roomsWanted;
  document.getElementById('minus').disabled = roomsWanted === 1;
  document.getElementById('plus').disabled  = roomsWanted === 4;
  document.getElementById('stepWrap').style.display = screen === 'list' ? 'flex' : 'none';

  if (screen === 'list'){
    ribbon.style.display = roomsWanted > 1 ? 'block' : 'none';
    ribbon.textContent = `Choosing room ${current+1} of ${roomsWanted}`;

    let html = '';
    if (roomsWanted > 1 && current > 0 && picks[0]){
      const r0 = findRoom(picks[0].roomId), rt0 = findRate(r0, picks[0].rateId);
      html += `<button class="same" onclick="sameAsFirst()">Same as Room 1
        <small>${labelFor(r0)} · ${rt0.meal} · ${inr(total(rt0))}</small></button>
        <div class="divider">or choose something different</div>`;
    }
    html += groups().map(g => {
      const cheapest = Math.min(...g.rooms.flatMap(r => r.rates.filter(x=>!x.sold).map(total)));
      return `<div class="ghead">
          <div class="gname">${g.cat}</div>
          <div class="gfrom">${g.rooms.length} option${g.rooms.length>1?'s':''} · from ${inr(cheapest)}</div>
        </div>` + g.rooms.map(r => cardHTML(r, g.rooms)).join('');
    }).join('');
    html += `<div class="note">Every price here is the full stay with taxes. Nothing new gets added at payment.</div>`;
    main.innerHTML = html;

    const done = !!picks[current];
    const running = picks.filter(Boolean).reduce((s,p)=> s + total(findRate(findRoom(p.roomId), p.rateId)), 0);
    const last = current === roomsWanted - 1;
    bar.innerHTML = `<div class="info">
        <div class="bt">${running ? inr(running) : 'No room selected'}</div>
        <div class="bs">${picks.filter(Boolean).length} of ${roomsWanted} room${roomsWanted>1?'s':''} chosen${running?' · 3 nights, taxes in':''}</div>
      </div>
      <button class="cta" onclick="next()" ${done?'':'disabled'}>${last ? 'Review' : 'Next room'} →</button>`;
  }

  if (screen === 'review'){
    ribbon.style.display = 'none';
    const lines = picks.map((p,i)=>{
      const r = findRoom(p.roomId), rt = findRate(r, p.rateId);
      const t = total(rt) + (priceBumped && i===0 ? 1500 : 0);
      return `<div class="rline">
        <div>
          <div class="rl-name">Room ${i+1} — ${labelFor(r)}</div>
          <div class="rl-meta">${rt.meal} · ${rt.cancel}<br>${r.bed} · 3 nights</div>
        </div>
        <div style="text-align:right">
          <div class="rl-name">${inr(t)}</div>
          <button class="edit" onclick="editRoom(${i})">Edit</button>
        </div>
      </div>`;
    }).join('');

    const base = picks.reduce((s,p)=> s + total(findRate(findRoom(p.roomId), p.rateId)), 0) + (priceBumped?1500:0);
    const tax = Math.round(base * 0.18);

    main.innerHTML = `
      ${priceBumped ? `<div class="alert"><b>The price of Room 1 changed.</b><br>
        The supplier moved it up by ₹1,500 while you were choosing. We have updated the total below.
        Nothing is charged until you confirm.</div>` : ''}
      <div class="review">
        ${lines}
        <div class="money"><span>Room charges</span><span>${inr(base - tax)}</span></div>
        <div class="money"><span>Taxes and fees</span><span>${inr(tax)}</span></div>
        <div class="money total"><span>Total</span><span>${inr(base)}</span></div>
      </div>
      ${!priceBumped ? `<div class="note"><a href="#" onclick="bumpPrice();return false" style="color:#0a6cff">Simulate a supplier price change →</a></div>` : ''}
      <div class="note" style="margin-top:8px">Free cancellation applies only to rooms marked free above. Mixed bookings cancel room by room.</div>`;

    bar.innerHTML = `<div class="info">
        <div class="bt">${inr(base)}</div>
        <div class="bs">${picks.length} room${picks.length>1?'s':''} · 3 nights · taxes included</div>
      </div>
      <button class="cta">Continue →</button>`;
  }
}

render();
</script>
</body>
</html>
